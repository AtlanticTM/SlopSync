; SlopSync — native conformance suite.
;
; The library (lib/slopsync/) is header-only, hardware-free C++20: no
; Arduino, no framework, no board. The `native` platform is therefore the
; only environment this repo needs — it compiles and runs the test suite
; with the host's own GCC/Clang, nothing else.
;
;   Run: pio test -e native
;
; Requires a host C++ toolchain in PATH supporting -std=gnu++2b (GCC 13+ /
; a recent Clang). Tests live under test/native/test_slopsync_*/ — the
; test_filter keeps that scope explicit as the suite grows.
[env:native]
platform = native
test_framework = doctest
test_filter = native/*
; Header-only library under test is included directly by the test sources —
; no src/ compilation (test_build_src defaults off), no framework. LDF stays
; at default chain mode: it auto-discovers lib/slopsync/include (PlatformIO's
; normal private-library scan) and resolves the doctest package include path.
build_flags =
	-std=gnu++2b
	-O2
	-Wall
